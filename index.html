<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>格闘ボール｜馬鹿ヶ原学園・放課後用具乱舞大会</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#201b16;color:#201b16;font-family:system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#unity-canvas{width:min(100vw,calc(100dvh * 16 / 9));height:min(100dvh,calc(100vw * 9 / 16));position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none;display:block}
#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background-color:#fff3d5;background-image:radial-gradient(#201b161a 1px,transparent 1px);background-size:12px 12px;gap:18px;padding:20px}
#loading img{width:min(570px,83vw);height:auto;max-height:43dvh;object-fit:contain}small{background:#ffd33b;border:3px solid #201b16;box-shadow:5px 5px #201b16;font-weight:900;padding:8px;transform:rotate(-2deg)}p{font-weight:800;margin:12px 0}progress{width:min(410px,75vw);height:23px;border:3px solid #201b16;box-shadow:4px 4px #201b16;accent-color:#e83b25;background:#fffdf1;justify-self:center}#error{max-width:600px;white-space:pre-wrap;color:#b82113;font-weight:700}#rotate{display:none}
@media(orientation:portrait){#rotate{display:block;position:fixed;bottom:10%;left:14px;right:14px;text-align:center;font-size:16px;font-weight:800;background:#ffd33b;color:#201b16;border:3px solid #201b16;padding:12px;pointer-events:none}}
</style></head><body>
<canvas id="unity-canvas" tabindex="-1" aria-label="格闘ボール ゲーム画面"></canvas>
<div id="loading"><small>馬鹿ヶ原学園　放課後・用具乱舞大会</small><img src="title.png" alt="格闘ボール"><p>ただいま、体育館に用具を持ち込み中。</p><progress id="progress" value="0" max="1" aria-label="ゲームの読み込み"></progress><div id="error"></div></div>
<div id="rotate">スマホを横向きにして、いざ決闘！</div>
<script>
var buildUrl='Build',canvas=document.querySelector('#unity-canvas'),script=document.createElement('script');
canvas.addEventListener('contextmenu',e=>e.preventDefault());
script.src=buildUrl+'/Web.loader.js';
script.onload=()=>createUnityInstance(canvas,{dataUrl:buildUrl+'/Web.data',frameworkUrl:buildUrl+'/Web.framework.js',codeUrl:buildUrl+'/Web.wasm',streamingAssetsUrl:'StreamingAssets',companyName:'Kakutou Sports Club',productName:'Kakutou Ball',productVersion:'0.2',matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5)},p=>document.querySelector('#progress').value=p).then(instance=>{window.unityInstance=instance;document.querySelector('#loading').style.display='none';canvas.focus()}).catch(()=>document.querySelector('#error').textContent='読み込めませんでした。ブラウザーを更新して、もう一度お試しください。');
script.onerror=()=>document.querySelector('#error').textContent='ゲームファイルを読み込めませんでした。通信状態を確認してください。';document.body.appendChild(script);
</script></body></html>
